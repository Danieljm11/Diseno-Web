<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reto 7 - Sección Fotográfica</title>
    <!-- Bootstrap desde la nube -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librería ImageHover -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/imagehover.css/1.0/css/imagehover.min.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="imagenes/rastreo.png">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center py-4">
        <h1 class="fw-bold display-5">Galería Fotográfica</h1>
        <p>Descubre nuestros proyectos destacados</p>
    </header>

    <!-- Sección principal -->
    <section class="container my-5">
        <div class="row g-4">
            <!-- Foto 1 -->
            <div class="col-md-4">
                <figure class="imghvr-fade">
                    <img src="imagenes/myriam-jessier-eveI7MOcSmw-unsplash.jpg" class="img-fluid" alt="SEO Marketing">
                    <figcaption class="bg-dark text-white">SEO Marketing</figcaption>
                </figure>
            </div>
            <!-- Foto 2 -->
            <div class="col-md-4">
                <figure class="imghvr-fade">
                    <img src="imagenes/swello-JUh9f3jAAi8-unsplash.jpg" class="img-fluid"
                        alt="Community Management">
                    <figcaption class="bg-dark text-white">Community Management</figcaption>
                </figure>
            </div>
            <!-- Foto 3 -->
            <div class="col-md-4">
                <figure class="imghvr-fade">
                    <img src="imagenes/rupixen-Q59HmzK38eQ-unsplash.jpg" class="img-fluid"
                        alt="Comercio Electrónico">
                    <figcaption class="bg-dark text-white">Comercio Electrónico</figcaption>
                </figure>
            </div>
            <!-- Foto 4 -->
            <div class="col-md-4">
                <figure class="imghvr-fade">
                    <img src="imagenes/element5-digital-ceWgSMd8rvQ-unsplash.jpg">
                    <figcaption class="bg-dark text-white">Automaquillaje</figcaption>
                </figure>
            </div>
            <!-- Foto 5 -->
            <div class="col-md-4">
                <figure class="imghvr-fade">
                    <img src="imagenes/markus-kammermann-pnPwc-Pffuk-unsplash.jpg" class="img-fluid"
                        alt="Neuromarketing">
                    <figcaption class="bg-dark text-white">Neuromarketing</figcaption>
                </figure>
            </div>
            <!-- Foto 6 -->
            <div class="col-md-4">
                <figure class="imghvr-fade">
                    <img src="imagenes/john-vid-MDT8cXwzG2U-unsplash.jpg" class="img-fluid" alt="Dibujo Vectorial">
                    <figcaption class="bg-dark text-white">Dibujo Vectorial</figcaption>
                </figure>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 Universidad CENFOTEC</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
