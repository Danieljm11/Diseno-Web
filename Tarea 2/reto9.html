<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reto 9 - Logotipos Enlazados</title>
    <!-- Bootstrap desde la nube -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="imagenes/rastreo.png">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">
        <h1 class="fw-bold display-5">Instituciones Asociadas</h1>
        <p>Haz clic en cada logo para visitar su sitio web</p>
    </header>

    <!-- Sección principal -->
    <section class="container my-5">
        <div class="row text-center g-4">
            <!-- Logo 1 -->
            <div class="col-md-4">
                <a href="https://www.volkswagen.cr/es.html" target="_blank">
                    <img src="imagenes/moritz-mentges-5MlBMYDsGBY-unsplash.jpg" class="img-fluid" alt="volkswagen">
                </a>
            </div>
            <!-- Logo 2 -->
            <div class="col-md-4">
                <a href="https://www.facebook.com/" target="_blank">
                    <img src="imagenes/mariia-shalabaieva-d64-ghA_rH4-unsplash.jpg" class="img-fluid" alt="facebook">
                </a>
            </div>
            <!-- Logo 3 -->
            <div class="col-md-4">
                <a href="https://www.porsche.com/international/" target="_blank">
                    <img src="imagenes/eric-prouzet-eTTytqY5q2s-unsplash.jpg" class="img-fluid" alt="Porsche">
                </a>
            </div>
            <!-- Logo 4 -->
            <div class="col-md-4">
                <a href="https://web.whatsapp.com/" target="_blank">
                    <img src="imagenes/mariia-shalabaieva-4VhDqJy69vQ-unsplash.jpg" class="img-fluid" alt="WhatsApp">
                </a>
            </div>
            <!-- Logo 5 -->
            <div class="col-md-4">
                <a href="https://www.adobe.com/" target="_blank">
                    <img src="imagenes/rubaitul-azad-gDXPCmktFdY-unsplash.jpg" class="img-fluid" alt="Adobe">
                </a>
            </div>
            <!-- Logo 6 -->
            <div class="col-md-4">
                <a href="https://www.google.com/" target="_blank">
                    <img src="imagenes/pawel-czerwinski-fpZZEV0uQwA-unsplash.jpg" class="img-fluid" alt="Google">
                </a>
            </div>
            <!-- Logo 7 -->
            <div class="col-md-4">
                <a href="https://www.netflix.com/" target="_blank">
                    <img src="imagenes/alexander-shatov-UVfvFrp4x4E-unsplash.jpg" class="img-fluid" alt="Netflix">
                </a>
            </div>
            <!-- Logo 8 -->
            <div class="col-md-4">
                <a href="https://www.microsoft.com/" target="_blank">
                    <img src="imagenes/abid-shah-KZ4kkKlGp-4-unsplash.jpg" class="img-fluid" alt="Microsoft">
                </a>
            </div>
            <!-- Logo 9 -->
            <div class="col-md-4">
                <a href="https://www.marshall.com/us/en?srsltid=AfmBOoqjE2vgReZzyd7icXAvVAFvYasgyZxLmBGW50V7h696wKxghSwa"
                    target="_blank">
                    <img src="imagenes/anastasia-zhenina-zO1fG-4sT8g-unsplash.jpg" class="img-fluid" alt="Marshall">
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 Universidad CENFOTEC</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
