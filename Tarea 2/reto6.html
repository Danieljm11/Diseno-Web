<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reto 6 - Banner Full Width</title>
    <!-- Bootstrap desde la nube -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="imagenes/rastreo.png">
    <style>
        .banner {
            background-image: url('imagenes/lautaro-andreani-UYsBCu9RP3Y-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-color: rgba(0, 0, 0, 0.5);
            /* capa de color */
            background-blend-mode: multiply;
            /* mezcla */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7);
            height: 100vh;
            /* ocupa toda la pantalla */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-3">
        <h1 class="fw-bold">Banner Promocional</h1>
    </header>

    <!-- Banner -->
    <section class="banner">
        <div>
            <h2 class="display-4 fw-bold">Bienvenido a TMART</h2>
            <p class="lead">Tu tienda minimalista de e-commerce</p>
            <!-- Botones grandes -->
            <a href="#" class="btn btn-primary btn-lg me-3">Comprar Ahora</a>
            <a href="#" class="btn btn-outline-light btn-lg">Más Información</a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 Universidad CENFOTEC</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
